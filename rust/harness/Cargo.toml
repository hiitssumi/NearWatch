[package]
name = "nearwatch-harness"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "nearwatch-harness"
path = "src/main.rs"

[dependencies]
near-workspaces.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
